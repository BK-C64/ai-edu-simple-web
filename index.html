<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Prototyp 3D - Etap 4</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div id="game-container"></div>
    <div id="crosshair"></div>

    <div id="hotbar">
        <div class="slot active" data-slot="0"><div class="slot-icon icon-grass"></div></div>
        <div class="slot" data-slot="1"><div class="slot-icon icon-dirt"></div></div>
        <div class="slot" data-slot="2"><div class="slot-icon icon-stone"></div></div>
        <div class="slot" data-slot="3"><div class="slot-icon icon-wood"></div></div>
        <div class="slot" data-slot="4"></div>
        <div class="slot" data-slot="5"></div>
        <div class="slot" data-slot="6"></div>
        <div class="slot" data-slot="7"></div>
        <div class="slot" data-slot="8"></div>
    </div>

    <!-- Dodano klasę hidden -->
    <div id="inventory-overlay" class="hidden">
        <div id="inventory-window">
            <div class="inventory-title">Inventory</div>
            <div class="inventory-grid">
                <!-- 27 slots for main inventory (3x9) -->
                <script>
                    for(let i=0; i<27; i++) {
                        document.write('<div class="slot"></div>');
                    }
                </script>
            </div>
            <div class="inventory-title">Hotbar</div>
            <div class="inventory-grid">
                <div class="slot"><div class="slot-icon icon-grass"></div></div>
                <div class="slot"><div class="slot-icon icon-dirt"></div></div>
                <div class="slot"><div class="slot-icon icon-stone"></div></div>
                <div class="slot"><div class="slot-icon icon-wood"></div></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>
        </div>
    </div>

    <div id="overlay">
        <h1>MINECRAFT JS</h1>
        <p>Kliknij, aby rozpocząć grę</p>
        <p><b>W, S, A, D</b> - Poruszanie | <b>Spacja</b> - Skok</p>
        <p><b>LPM</b> - Niszczenie | <b>PPM</b> - Budowanie</p>
        <p><b>Rolka myszy / 1-9</b> - Wybór bloku</p>
        <p><b>E</b> - Otwórz/Zamknij Inwentarz</p>
    </div>

    <!-- Import Map for ES6 Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="src/main.js"></script>
</body>
</html>
